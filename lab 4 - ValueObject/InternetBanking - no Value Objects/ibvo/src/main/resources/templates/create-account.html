<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Create Account</h1>
  </header>
  <main>
    <div class="card">
      <form id="create-account-form">
        <label for="id">Account ID</label>
        <input id="id" name="id" required />

        <label for="name">Owner Name</label>
        <input id="name" name="name" required />

        <label for="amount">Initial Balance</label>
        <input id="amount" name="amount" type="number" min="0" step="0.01" required />

        <label for="currency">Currency</label>
        <select id="currency" name="currency" required>
          <option th:each="currency : ${currencies}" th:value="${currency}" th:text="${currency}"></option>
        </select>

        <button type="submit">Create Account</button>
      </form>
      <div id="message" class="result" style="display:none"></div>
    </div>
    <div class="page-links">
      <a href="/">Back to Home</a>
    </div>
  </main>
  <footer>Simple Bank demo</footer>

  <script>
    const form = document.getElementById('create-account-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.style.display = 'none';

      const body = {
        id: form.id.value.trim(),
        name: form.name.value.trim(),
        initialBalance: Math.round(Number(form.amount.value) * 100), // Convert dollars to cents
        currency: form.currency.value,
      };

      const response = await fetch('/accounts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const text = await response.text();
      message.textContent = text;
      message.className = 'result ' + (response.ok ? 'success' : 'error');
      message.style.display = 'block';
    });
  </script>
</body>
</html>
