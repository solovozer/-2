<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Create Account</h1>
  </header>
  <main>
    <div class="card">
      <form id="create-account-form">
        <label for="username">Username</label>
        <input id="username" name="username" required placeholder="Enter your username" />

        <label for="initialBalance">Initial Balance</label>
        <input id="initialBalance" name="initialBalance" type="number" min="0" step="0.01" required />

        <label for="currency">Currency</label>
        <select id="currency" name="currency" required>
          <!-- Options populated by JavaScript -->
        </select>

        <button type="submit">Create Account</button>
      </form>
      <div id="message" class="result" style="display:none"></div>
    </div>
    <div class="page-links">
      <a href="/">Back to Home</a>
      <a href="/create-user">Create User</a>
    </div>
  </main>
  <footer>Simple Bank demo</footer>

  <script>
    async function loadCurrencies() {
      try {
        const response = await fetch('/currencies');
        const currencies = await response.json();
        const select = document.getElementById('currency');
        currencies.forEach(currency => {
          const option = document.createElement('option');
          option.value = currency;
          option.textContent = currency;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Failed to load currencies:', error);
      }
    }

    loadCurrencies();

    const form = document.getElementById('create-account-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => { 
          event.preventDefault();
          message.style.display = 'none';

          const body = {
            username: form.username.value.trim(),
            initialBalance: parseFloat(form.initialBalance.value),
            currency: form.currency.value,
          };

          const response = await fetch('/accounts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });

          const result = await response.text();
          message.textContent = result;
          message.className = 'result ' + (response.ok ? 'success' : 'error');
          message.style.display = 'block';
      });
  </script>
</body>
</html>
