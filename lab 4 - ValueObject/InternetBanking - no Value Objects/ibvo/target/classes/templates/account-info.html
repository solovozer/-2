<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Info</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Account Info</h1>
  </header>
  <main>
    <div class="card">
      <form id="account-info-form">
        <label for="id">Account ID</label>
        <input id="id" name="id" required />
        <button type="submit">Check Balance</button>
      </form>
      <div id="error-message" class="result error" style="display:none"></div>
    </div>

    <div id="account-details" style="display:none">
      <div class="card">
        <h2>Account Details</h2>
        <p><strong>Account ID:</strong> <span id="display-id"></span></p>
        <p><strong>Owner:</strong> <span id="display-owner"></span></p>
        <p><strong>Balance:</strong> <span id="display-balance" style="font-size: 24px; font-weight: bold; color: #1f6feb;"></span></p>
      </div>

      <div class="card">
        <h2>Transaction History</h2>
        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 2px solid #cbd5e1;">
              <th style="text-align: left; padding: 10px; font-weight: 600;">From</th>
              <th style="text-align: left; padding: 10px; font-weight: 600;">To</th>
              <th style="text-align: right; padding: 10px; font-weight: 600;">Amount</th>
              <th style="text-align: left; padding: 10px; font-weight: 600;">Date</th>
            </tr>
          </thead>
          <tbody id="transactions-body">
            <tr>
              <td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Loading transactions...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="page-links">
