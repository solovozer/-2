<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Info</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Account Info</h1>
  </header>
  <main>
    <div class="card">
      <form id="account-info-form">
        <label for="id">Account Name</label>
        <input id="id" name="id" required />
        <button type="submit">Check Balance</button>
      </form>
      <div id="error-message" class="result error" style="display:none"></div>
    </div>

    <div id="account-details" style="display:none">
      <div class="card">
        <h2>Account Details</h2>
        <p><strong>Account Name:</strong> <span id="display-id"></span></p>
        <p><strong>Owner:</strong> <span id="display-owner"></span></p>
        <p><strong>Balance:</strong> <span id="display-balance" style="font-size: 24px; font-weight: bold; color: #1f6feb;"></span></p>
      </div>

      <div class="card">
        <h2>Transaction History</h2>
        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 2px solid #cbd5e1;">
              <th style="text-align: left; padding: 10px; font-weight: 600;">From</th>
              <th style="text-align: left; padding: 10px; font-weight: 600;">To</th>
              <th style="text-align: right; padding: 10px; font-weight: 600;">Amount</th>
              <th style="text-align: left; padding: 10px; font-weight: 600;">Date</th>
            </tr>
          </thead>
          <tbody id="transactions-body">
            <tr>
              <td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Loading transactions...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="page-links">
        <a href="/">Back to Home</a>
      </div>
    </div>
  </main>
  <footer>Simple Bank demo</footer>

  <script>
    const form = document.getElementById('account-info-form');
    const errorMessage = document.getElementById('error-message');
    const accountDetails = document.getElementById('account-details');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.style.display = 'none';
      accountDetails.style.display = 'none';

      const accountId = form.id.value.trim();

      try {
        // Fetch account info
        const accountResponse = await fetch(`/accounts/${accountId}`);
        if (!accountResponse.ok) {
          throw new Error('Account not found');
        }
        const accountData = await accountResponse.json();

        // Display account details
        document.getElementById('display-id').textContent = accountId;
        document.getElementById('display-owner').textContent = accountData.owner || 'N/A';
        document.getElementById('display-balance').textContent = accountData.balance || accountData.formattedBalance || 'N/A';

        // Fetch transaction history
        const transResponse = await fetch(`/accounts/${accountId}/transactions`);
        if (transResponse.ok) {
          const transactions = await transResponse.json();
          const tbody = document.getElementById('transactions-body');
          
          if (transactions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">No transactions yet</td></tr>';
          } else {
            tbody.innerHTML = transactions.map(t => `
              <tr style="border-bottom: 1px solid #e5e7eb;">
                <td style="padding: 10px;">${t.fromId}</td>
                <td style="padding: 10px;">${t.toId}</td>
                <td style="padding: 10px; text-align: right;">${(t.amount / 100).toFixed(2)} ${t.currency}</td>
                <td style="padding: 10px;">${new Date(t.timestamp).toLocaleString()}</td>
              </tr>
            `).join('');
          }
        } else {
          document.getElementById('transactions-body').innerHTML = 
            '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Could not load transactions</td></tr>';
        }

        accountDetails.style.display = 'block';
      } catch (error) {
        errorMessage.textContent = `Error: ${error.message}`;
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>
</html>
