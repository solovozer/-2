<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Money</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <h1>Transfer Money</h1>
    </header>

    <main>
        <div class="card">      
            <form id="transferForm">
                <label for="senderUsername">Sender Username:</label>
                <input type="text" id="senderUsername" name="senderUsername" required>
                
                <label for="receiverUsername">Receiver Username:</label>
                <input type="text" id="receiverUsername" name="receiverUsername" required>
                
                <label for="amount">Amount:</label>
                <input type="number" step="0.01" id="amount" name="amount" min="0.01" required>
                
                <label for="currency">Currency</label>
                <select id="currency" name="currency" required>
                    <!-- Options populated by JavaScript -->
                </select>

                <button type="submit">Transfer Money</button>
            </form>
            <div id="message"></div>   
        </div>
        <div class="page-links">
            <a href="/">Back to Home</a>
            <a href="/convert-currency">Convert Currency</a>
        </div>
    </main>
    
    <script>
        async function loadCurrencies() {
            try {
                const response = await fetch('/currencies');
                if (!response.ok) throw new Error('Failed to fetch');

                const currencyList = await response.json();
                const currencySelect = document.getElementById('currency');

                const fragment = document.createDocumentFragment();
                currencyList.forEach(currency => {
                    fragment.appendChild(new Option(currency, currency));
                });

                currencySelect.innerHTML = '';
                currencySelect.appendChild(fragment);
            } catch (error) {
                console.error('Failed to load currencies:', error);
            }
        }

        loadCurrencies();

        document.getElementById('transferForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none';

            const senderUsername = document.getElementById('senderUsername').value;
            const receiverUsername = document.getElementById('receiverUsername').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const currency = document.getElementById('currency').value;

            const body = {
                fromUser: senderUsername.trim(),
                toUser: receiverUsername.trim(),
                amount: amount,
                currency: currency,
            };

            const response = await fetch('/transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });

            const result = await response.text();
            if (response.ok) {
                messageDiv.textContent = result;
                messageDiv.className = 'result success';
                messageDiv.style.display = 'block';
            } else {
                messageDiv.textContent = result;
                messageDiv.className = 'result error';
                messageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
