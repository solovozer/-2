<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transfer Money</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Transfer Money</h1>
  </header>
  <main>
    <div class="card">
      <form id="transfer-form">
        <label for="fromId">From Account</label>
        <input id="fromId" name="fromId" required />

        <label for="toId">To Account</label>
        <input id="toId" name="toId" required />

        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" min="0.01" step="0.01" required />

        <label for="currency">Currency</label>
        <select id="currency" name="currency" required>
          <!-- Options populated by JavaScript -->
        </select>

        <button type="submit">Send Transfer</button>
      </form>
      <div id="message" class="result" style="display:none"></div>
    </div>
    <div class="page-links">
      <a href="/">Back to Home</a>
    </div>
  </main>
  <footer>Simple Bank demo</footer>

  <script>
    async function loadCurrencies() {
      try {
        const response = await fetch('/currencies');
        const currencies = await response.json();
        const select = document.getElementById('currency');
        currencies.forEach(currency => {
          const option = document.createElement('option');
          option.value = currency;
          option.textContent = currency;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Failed to load currencies:', error);
      }
    }

    loadCurrencies();

    const form = document.getElementById('transfer-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.style.display = 'none';

      const body = {
        fromId: form.fromId.value.trim(),
        toId: form.toId.value.trim(),
        amount: parseFloat(form.amount.value), // Send decimal amount directly
        currency: form.currency.value,
      };

      const response = await fetch('/transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const text = await response.text();
      message.textContent = text;
      message.className = 'result ' + (response.ok ? 'success' : 'error');
      message.style.display = 'block';
    });
  </script>
</body>
</html>
