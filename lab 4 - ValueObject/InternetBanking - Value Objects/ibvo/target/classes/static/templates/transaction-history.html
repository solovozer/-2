<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Info</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Transaction history</h1>
  </header>
  <main>
      <div class="card">
        <h2>Transaction History</h2>
        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 2px solid #cbd5e1;">
              <th style="text-align: left; padding: 10px; font-weight: 600;">From</th>
              <th style="text-align: left; padding: 10px; font-weight: 600;">To</th>
              <th style="text-align: right; padding: 10px; font-weight: 600;">Amount</th>
              <th style="text-align: left; padding: 10px; font-weight: 600;">Date</th>
            </tr>
          </thead>
          <tbody id="transactions-body">
            <tr>
              <td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Loading transactions...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="page-links">
        <a href="/">Back to Home</a>
      </div>
    </div>
  </main>
  <footer>Simple Bank demo</footer>


   <script>
        async function loadTransactions() {
            const tbody = document.getElementById('transactions-body');
            try {
                const transResponse = await fetch(`/accounts/transactions/ALL`);
                if (transResponse.ok) {
                    const transactions = await transResponse.json();
                    const tbody = document.getElementById('transactions-body');

                    if (transactions.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">No transactions yet</td></tr>';
                    } else {
                        tbody.innerHTML = transactions.map(t => `
                        <tr style="border-bottom: 1px solid #e5e7eb;">
                            <td style="padding: 10px;">${t.fromId}</td>
                            <td style="padding: 10px;">${t.toId}</td>
                            <td style="padding: 10px; text-align: right;">${t.amount} ${t.currency}</td>
                            <td style="padding: 10px;">${new Date(t.timestamp).toLocaleString()}</td>
                        </tr>
                        `).join('');
                    }
                } else {
                document.getElementById('transactions-body').innerHTML = 
                    '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Could not load transactions</td></tr>';
                }
            } catch (error) {
                console.error('Error loading transactions:', error);
                document.getElementById('transactions-body').innerHTML = 
                    '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Error loading transactions</td></tr>';
            }
        }
        loadTransactions()
    </script>
</body>
</html>
